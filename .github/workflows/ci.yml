name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: node scripts/validate-atlas.mjs
      - run: node scripts/validate-interactions.mjs
      - run: node scripts/validate-injuries.mjs
      - run: node scripts/validate-inspection.mjs
      - run: node scripts/validate-surface.mjs
      - run: node scripts/validate-base-path.mjs
      - run: npm run build
