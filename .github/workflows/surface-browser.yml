name: Integrated anatomy acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  surface:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      WEBKIT_DISABLE_DMABUF_RENDERER: '1'
      ATLAS_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check && npm run build
      - name: Prepare inspectable build and source
        run: tar -czf anatomy-debug.tar.gz dist app web scripts package.json package-lock.json
      - name: Install browser tools outside the application
        run: |
          npm install --prefix "$RUNNER_TEMP/surface-browser" --no-save --package-lock=false playwright@1.55.1 pngjs@7.0.0
          node "$RUNNER_TEMP/surface-browser/node_modules/playwright/cli.js" install --with-deps ${{ matrix.browser }}
      - name: Inspect anatomy on desktop and mobile
        env:
          ATLAS_BROWSER_TOOLS: ${{ runner.temp }}/surface-browser
        run: node scripts/check-surface-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anatomy-browser-evidence-${{ matrix.browser }}
          path: |
            anatomy-debug.tar.gz
            artifacts/refinement/
          retention-days: 14
