name: Abrasion mesh proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  abrasion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check && node scripts/validate-abrasion.mjs && npm run build
      - run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-save --package-lock=false playwright@1.55.1 pngjs@7
          node "$RUNNER_TEMP/browser/node_modules/playwright/cli.js" install --with-deps chromium
      - run: node scripts/check-abrasion-browser.mjs
        env:
          ATLAS_BROWSER_TOOLS: ${{ runner.temp }}/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abrasion-proof
          path: artifacts/abrasion/
          retention-days: 14
